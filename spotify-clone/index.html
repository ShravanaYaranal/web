<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-brands fa-spotify"></i>
                <span>Spotify</span>
            </div>
            
            <nav class="nav-menu">
                <ul>
                    <li class="active">
                        <a href="#"><i class="fa-solid fa-house"></i><span>Home</span></a>
                    </li>
                    <li>
                        <a href="#"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></a>
                    </li>
                </ul>
            </nav>

            <div class="library">
                <div class="library-header">
                    <button class="lib-btn">
                        <i class="fa-solid fa-book-open"></i>
                        <span>Your Library</span>
                    </button>
                    <div class="lib-actions">
                        <button><i class="fa-solid fa-plus"></i></button>
                        <button><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>

                <div class="library-content">
                    <div class="lib-card">
                        <h4>Create your first playlist</h4>
                        <p>It's easy, we'll help you</p>
                        <button class="badge-btn">Create playlist</button>
                    </div>
                    <div class="lib-card">
                        <h4>Let's find some podcasts to follow</h4>
                        <p>We'll keep you updated on new episodes</p>
                        <button class="badge-btn">Browse podcasts</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="nav-arrows">
                    <button><i class="fa-solid fa-chevron-left"></i></button>
                    <button><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="topbar-actions">
                    <button class="badge-btn outline">Explore Premium</button>
                    <button class="badge-btn flex-btn"><i class="fa-regular fa-circle-down"></i> Install App</button>
                    <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                    <button class="user-btn"><i class="fa-solid fa-user"></i></button>
                </div>
            </header>

            <div class="content-scroll">
                <section class="playlist-section">
                    <h2>Focus</h2>
                    <div class="card-grid" id="playlist-grid">
                        <!-- Cards will be injected by JavaScript -->
                    </div>
                </section>
                
                <section class="playlist-section">
                    <h2>Spotify Playlists</h2>
                    <div class="card-grid" id="spotify-playlists">
                        <!-- Cards will be injected by JavaScript -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Music Player Bar -->
    <footer class="player-bar">
        <!-- Track Info -->
        <div class="track-info">
            <img src="https://via.placeholder.com/56" alt="Album Art" id="cover-img">
            <div class="track-details">
                <h4 id="track-title">Song Title</h4>
                <p id="track-artist">Artist Name</p>
            </div>
            <button class="icon-btn" id="like-btn"><i class="fa-regular fa-heart"></i></button>
        </div>

        <!-- Player Controls -->
        <div class="player-controls">
            <div class="control-buttons">
                <button class="icon-btn"><i class="fa-solid fa-shuffle"></i></button>
                <button class="icon-btn" id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="play-btn" id="play-btn"><i class="fa-solid fa-play"></i></button>
                <button class="icon-btn" id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
                <button class="icon-btn"><i class="fa-solid fa-repeat"></i></button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar-bg" id="progress-container">
                    <div class="progress-bar" id="progress"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>

        <!-- Extra Controls -->
        <div class="extra-controls">
            <button class="icon-btn"><i class="fa-brands fa-youtube"></i></button>
            <button class="icon-btn"><i class="fa-solid fa-microphone"></i></button>
            <button class="icon-btn"><i class="fa-solid fa-bars"></i></button>
            <button class="icon-btn"><i class="fa-solid fa-computer"></i></button>
            <div class="volume-container">
                <button class="icon-btn"><i class="fa-solid fa-volume-high"></i></button>
                <div class="progress-bar-bg volume-bar">
                    <div class="progress-bar" style="width: 70%;"></div>
                </div>
            </div>
            <button class="icon-btn"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></button>
        </div>
    </footer>

    <!-- Audio Element -->
    <audio id="audio"></audio>

    <script src="script.js"></script>
</body>
</html>
