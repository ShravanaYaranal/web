<!DOCTYPE html>

<head>

<style>
    body>div {
        height: 100%;
        width: 100%;
        background-color: rgb(154, 154, 168);
        position: absolute;
        display: flex;
    }
    *{
        margin: 0;
    }

    body>div:nth-child(1)>img:nth-child(1) {
        top: 30px;
        left: 100px;
        height: 100px;
        width: 250px;
        display: flex;
        position: relative;
        animation-name: champions;
        animation-duration: 5s;
        animation-timing-function: linear;
        animation-delay: 0s;
        animation-iteration-count: 5;


    }

    body>div:nth-child(1)>img:nth-child(2) {
        top: 5px;
        left: 175px;
        height: 120px;
        width: 200px;

        animation-delay: 0s;

    }

    body>div:nth-child(1)>img:nth-child(3) {

        animation-iteration-count: 5;
    }
    body>div:nth-child(1)>img:nth-child(4){

}
body>div:nth-child(1)>img:nth-child(5){

        position:absolute;
        
    }
    body>div:nth-child(1)>img:nth-child(6){
        bottom:10px;

     from{

        }
    }
