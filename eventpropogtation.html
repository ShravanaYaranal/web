<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #grandparent{
            border: 2px maroon;
            height: 250px;
            width: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: maroon;
        }

        #parent{
            border: 2px yellow;
            height: 170px;
            width: 170px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: yellow;
        }
        #child{
            border: 2px blue;
            height: 100px;
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color:blue;
        }
    </style>
</head>
<body>
    <div id="grandparent">
        <div id="parent">
            <div id="child">

            </div>
        </div>
    </div>
    <script>
        let grandparent=document.querySelector("#grandparent");
        let parent=document.querySelector("#parent");
        let child=document.querySelector("#child")

        grandparent.addEventListener("click",()=>{
          
            console.log("grandparent");
        })
        parent.addEventListener("click",(s)=>{
               s.stopPropagation();
            console.log("parent");
            
        })
        child.addEventListener("click",(e)=>{
            //    e.stopPropagation();
            console.log("child");
            
        })
    </script>

</body>
</html>
